<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta http-equiv="X-UA-Compatible" content="IE=edge">

<meta name="viewport"
content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">


<link rel="stylesheet" href="./resources/ol.css">

<link rel="stylesheet" href="resources/fontawesome-all.min.css">

<link href="resources/photon-geocoder-autocomplete.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="./resources/ol-layerswitcher.css">

<link rel="stylesheet"
href="./resources/qgis2web.css">


<style>


html,body{

margin:0;
padding:0;
background:white;
font-family:Arial, sans-serif;

}


/* MAP */

#map{

width:100%;
height:700px;

}



/* YEAR CONTROL PANEL */

#year-selector{

position:absolute;

top:20px;

right:20px;

background:white;

padding:15px 18px;

z-index:1000;

border-radius:12px;

box-shadow:0px 3px 12px rgba(0,0,0,0.25);

font-size:13px;

line-height:1.6;

}


#year-selector h2{

font-size:14px;

font-weight:bold;

margin:0 0 8px 0;

}


#year-selector h3{

font-size:13px;

font-weight:normal;

margin:0 0 10px 0;

}



#year-selector input{

margin-right:8px;

transform:scale(1.05);

}



/* RADIO BUTTON SPACING */

#year-selector label{

display:block;

margin-bottom:7px;

}





/* LEGEND */

#legend{

position:absolute;

bottom:30px;

right:20px;

background:white;

padding:15px 18px;

z-index:1000;

border-radius:12px;

box-shadow:0px 3px 12px rgba(0,0,0,0.25);

font-size:12px;

line-height:1.5;

}



#legend h3{

font-size:13px;

font-weight:bold;

margin-top:0;

margin-bottom:10px;

}



#legend img{

vertical-align:middle;

margin-right:6px;

}



#legend hr{

border:0;

border-top:1px solid #cccccc;

margin:12px 0;

}



</style>


<title>
Annual Average PM2.5 Map
</title>


</head>



<body>





<!-- YEAR SELECTION -->

<div id="year-selector">


<h2>Annual Average PM2.5 (µg/m³)</h2>

<h3>Year</h3>



<label>

<input type="radio"
name="year"
value="2021"
onclick="showPM25Layer(2021)"
checked>

2021

</label>



<label>

<input type="radio"
name="year"
value="2022"
onclick="showPM25Layer(2022)">

2022

</label>



<label>

<input type="radio"
name="year"
value="2023"
onclick="showPM25Layer(2023)">

2023

</label>



<label>

<input type="radio"
name="year"
value="2024"
onclick="showPM25Layer(2024)">

2024

</label>



<label>

<input type="radio"
name="year"
value="2025"
onclick="showPM25Layer(2025)">

2025

</label>



</div>









<!-- STATIC LEGEND -->

<div id="legend">


<h3>Annual Average PM2.5 (µg/m³)</h3>



<img src="styles/legend/PM_2021_0_0.png">
5 - 6

<br>


<img src="styles/legend/PM_2021_0_1.png">
6 - 7

<br>


<img src="styles/legend/PM_2021_0_2.png">
7 - 8

<br>


<img src="styles/legend/PM_2021_0_3.png">
8 - 9

<br>


<img src="styles/legend/PM_2021_0_4.png">
9 - 10

<br>


<img src="styles/legend/PM_2021_0_5.png">
10 - 11




</div>







<!-- MAP -->

<div id="map">


<div id="popup" class="ol-popup">


<a href="#"
id="popup-closer"
class="ol-popup-closer">
</a>


<div id="popup-content"></div>


</div>


</div>








<!-- JAVASCRIPT FILES -->


<script src="resources/qgis2web_expressions.js"></script>


<script src="./resources/functions.js"></script>


<script src="./resources/ol.js"></script>


<script src="./resources/ol-layerswitcher.js"></script>


<script src="resources/photon-geocoder-autocomplete.min.js"></script>


<script src="resources/olms.js"></script>





<!-- BOUNDARY FILE -->

<script src="layers/Birmingham_Jefferson_Shelby_5.js"></script>


<script src="styles/Birmingham_Jefferson_Shelby_5_style.js"></script>





<!-- LAYER DEFINITIONS -->

<script src="./layers/layers.js"
type="text/javascript">
</script>





<script src="./resources/Autolinker.min.js"></script>




<!-- MAP INITIALIZATION -->

<script src="./resources/qgis2web.js"></script>




</body>

</html>
